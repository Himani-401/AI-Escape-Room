version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./backend/data/escape_room.db
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
    volumes:
      - .:/workspace
    command: sh -c "cd /workspace/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "cd /workspace/frontend && npm install && npm run dev -- --host 0.0.0.0 --port 5173"
